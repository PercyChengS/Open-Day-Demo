##
# Nginx default server block for Open Day demo (/var/www/album1)
# Target path on server: /etc/nginx/sites-available/default
##

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/album1;
    index index.html index.htm;

    server_name _;

    location / {
        # Force browsers/phones to always re-fetch the latest file
        # so audience does not need to manually pull-to-refresh
        # after each `wget -O` update during the demo.
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|mp3)$ {
        # Media/images can keep a short cache since they change less often
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    error_page 404 /index.html;
}
