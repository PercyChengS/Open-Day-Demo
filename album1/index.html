<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to nginx!</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <style>
        :root {
            --text-base: clamp(1.125rem, 1rem + 0.5vw, 1.375rem);
            --text-xl:   clamp(1.875rem, 1.4rem + 1.5vw, 2.75rem);
        }

        html {
            color-scheme: light dark;
        }

        body {
            width: 35em;
            margin: 0 auto;
            font-family: Tahoma, Verdana, Arial, sans-serif;
            font-size: var(--text-base);
            line-height: 1.7;
        }

        h1 {
            font-size: var(--text-xl);
        }
    </style>
</head>
<body>
    <div class="container text-end mt-3 refresh-container">
      <button type="button" class="btn btn-primary shadow-sm" onclick="hardRefresh()">刷新頁面</button>
    </div>

    <h1>Welcome to nginx!</h1>
    <p>If you see this page, the nginx web server is successfully installed and working.</p>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
    <script>
      function hardRefresh() {
        const url = new URL(window.location.href);
        url.searchParams.set('_', Date.now());
        window.location.href = url.toString();
      }
    </script>
</body>
</html>
